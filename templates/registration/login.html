{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm"><div class="card-body p-4">
      <h4 class="mb-3">Log in</h4>
      <form method="post">
        {% csrf_token %}
        {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
        <div class="mb-3"><label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
          <input type="text" name="username" class="form-control" id="{{ form.username.id_for_label }}" required autofocus></div>
        <div class="mb-3"><label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
          <input type="password" name="password" class="form-control" id="{{ form.password.id_for_label }}" required></div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary w-100">Log in</button>
      </form>
      <p class="mt-3 mb-0 text-muted">No account? <a href="{% url 'signup' %}">Sign up</a></p>
    </div></div>
  </div>
</div>
{% endblock %}
